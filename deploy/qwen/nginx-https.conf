server {
    listen 443 ssl;
    server_name 8.148.28.233;
    ssl_certificate /etc/letsencrypt/live/bilingualreader-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bilingualreader-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;
    access_log off;
    location = /translate {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
    location = /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
    location / { return 404; }
}
